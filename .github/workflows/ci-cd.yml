name: CI/CD Web

# Pipeline por etapas. 1 y 2 corren en paralelo; 3 (build) espera a la etapa 1;
# 4 publica en GitHub Pages solo desde main.
#
#   1 · Lint ───────────┐
#                       ├─► 3 · Build ─► 4 · Deploy a GitHub Pages (main, con aprobación)
#   2 · Auditoría ──────┘

on:
  push:
    branches: [main, develop]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main, develop]
    paths-ignore: ["**.md"]
  workflow_dispatch:

# Un push nuevo a la misma rama cancela la corrida anterior (ahorra minutos).
concurrency:
  group: ci-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- 1 · Lint
  lint:
    name: "1 · Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: ESLint
        run: npm run lint

  # ------------------------------------------------------------ 2 · Auditoría
  audit:
    name: "2 · Auditoría de dependencias"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Informa las vulnerabilidades conocidas sin bloquear el pipeline: el
      # resultado queda en el resumen del job para revisarlo y actualizar versiones.
      - name: npm audit (solo dependencias de producción)
        continue-on-error: true
        run: |
          npm audit --omit=dev | tee audit.txt
          {
            echo "### npm audit"
            echo
            echo '```'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- 3 · Build
  build:
    name: "3 · Build"
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # VITE_BASE: GitHub Pages sirve el sitio bajo /<nombre-del-repo>/.
      # VITE_API_URL: URL (HTTPS) del backend de staging; se define en
      # Settings > Secrets and variables > Actions > Variables (STAGING_API_URL).
      - name: Compilar
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API_URL: ${{ vars.STAGING_API_URL }}

      # Las rutas internas del SPA (p. ej. /admin/users) devuelven 404 en Pages al
      # recargar; con esta copia Pages sirve la app y React Router resuelve la ruta.
      - name: Fallback del SPA para Pages
        run: cp dist/index.html dist/404.html

      - name: Guardar el build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 3

      - name: Preparar artefacto de GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ----------------------------------------------------------- 4 · Deploy
  deploy:
    name: "4 · Deploy a GitHub Pages"
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # Para exigir aprobación manual: Settings > Environments > github-pages >
    # Required reviewers. Requiere Pages con fuente "GitHub Actions".
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
